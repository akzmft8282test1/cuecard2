<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>큐카드 삭제</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <nav class="bg-indigo-600 text-white shadow-md mb-8">
    <div class="max-w-xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">🗑️ 큐카드 삭제</h1>
      <a href="/" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg text-sm font-medium transition">← 메인 화면으로</a>
    </div>
  </nav>

  <main class="max-w-xl mx-auto px-4">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">삭제할 큐카드 선택</label>
        <select id="delSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-rose-500">
          <option value="">목록을 불러오는 중...</option>
        </select>
      </div>

      <button onclick="deleteCard()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 rounded-xl transition shadow-md">
        선택한 큐카드 영구 삭제
      </button>
    </div>
  </main>

  <script>
    async function loadSelectOptions() {
      const select = document.getElementById('delSelect');
      try {
        const res = await fetch('/api/cuecards');
        const cards = await res.json();

        if (cards.length === 0) {
          select.innerHTML = '<option value="">삭제할 큐카드가 없습니다.</option>';
          return;
        }

        select.innerHTML = cards.map(c => `<option value="${c.id}">${c.title} (ID: ${c.id})</option>`).join('');
      } catch (err) {
        alert('목록을 불러오지 못했습니다.');
      }
    }

    async function deleteCard() {
      const select = document.getElementById('delSelect');
      const id = select.value;

      if (!id) {
        alert('삭제할 카드를 선택해주세요.');
        return;
      }

      const confirmed = confirm('정말로 이 큐카드를 삭제하시겠습니까?');
      if (!confirmed) return;

      try {
        const res = await fetch(`/api/cuecards/${id}`, { method: 'DELETE' });
        if (res.ok) {
          alert('성공적으로 삭제되었습니다.');
          loadSelectOptions(); // 목록 자동 갱신
        } else {
          alert('삭제 처리에 실패했습니다.');
        }
      } catch (err) {
        alert('서버 통신 오류가 발생했습니다.');
      }
    }

    window.onload = loadSelectOptions;
  </script>
</body>
</html>
