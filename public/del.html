<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>큐카드 삭제</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', 'Noto Sans KR', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <header class="bg-slate-900 text-white shadow-md border-b border-slate-800 mb-8">
    <div class="max-w-xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-lg font-bold flex items-center gap-2">
        <i class="fa-solid fa-trash-can text-rose-400"></i> 큐카드 삭제
      </h1>
      <a href="/" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
        ← 메인 화면으로
      </a>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-2">삭제할 큐카드 선택</label>
        <select id="delSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
          <option value="">목록을 불러오는 중...</option>
        </select>
      </div>

      <button onclick="deleteCard()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
        <i class="fa-solid fa-trash"></i> 선택한 큐카드 영구 삭제
      </button>
    </div>
  </main>

  <script>
    async function loadSelectOptions() {
      const select = document.getElementById('delSelect');
      try {
        const res = await fetch('/api/cuecards');
        const cards = await res.json();

        if (cards.length === 0) {
          select.innerHTML = '<option value="">삭제할 큐카드가 없습니다.</option>';
          return;
        }

        select.innerHTML = cards.map(c => `<option value="${c.id}">${c.title} (ID: ${c.id})</option>`).join('');
      } catch (err) {
        alert('목록을 불러오지 못했습니다.');
      }
    }

    async function deleteCard() {
      const select = document.getElementById('delSelect');
      const id = select.value;

      if (!id) {
        alert('삭제할 카드를 선택해 주세요.');
        return;
      }

      const confirmed = confirm('정말로 이 큐카드를 삭제하시겠습니까?');
      if (!confirmed) return;

      try {
        const res = await fetch(`/api/cuecards/${id}`, { method: 'DELETE' });
        if (res.ok) {
          alert('성공적으로 삭제되었습니다.');
          loadSelectOptions();
        } else {
          alert('삭제 처리에 실패했습니다.');
        }
      } catch (err) {
        alert('서버 통신 오류가 발생했습니다.');
      }
    }

    window.onload = loadSelectOptions;
  </script>
</body>
</html>
